<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saad Media Labs Cafe - Premium Digital Menu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Syne (for headings) & Inter (for body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        syne: ['Syne', 'sans-serif'],
                    },
                    colors: {
                        gold: '#D4AF37',
                        darkBg: '#0D0D11',
                        darkCard: '#16161F',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Smooth Scrollbar & Animations */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0D0D11;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4AF37;
            border-radius: 10px;
        }
        .glass {
            background: rgba(22, 22, 31, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        /* Custom slide up animation on load */
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans antialiased selection:bg-gold selection:text-darkBg">

    <!-- Top Glow Effect -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[500px] h-[150px] bg-gradient-to-b from-amber-500/10 to-transparent blur-3xl pointer-events-none z-0"></div>

    <div class="max-w-md mx-auto min-h-screen pb-32 relative z-10 px-4">
        
        <!-- Header Section -->
        <header class="pt-8 pb-6 text-center animate-slide-up" style="animation-delay: 0.1s;">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-tr from-amber-500 to-gold p-[2px] shadow-lg shadow-amber-500/10 mb-3">
                <div class="w-full h-full bg-darkBg rounded-full flex items-center justify-center">
                    <span class="font-syne text-gold text-2xl">S</span>
                </div>
            </div>
            <h1 class="font-syne text-3xl font-extrabold tracking-tight text-glow">SAAD MEDIA LABS</h1>
            <p class="text-xs tracking-[0.25em] text-gold uppercase mt-1 font-semibold">Premium Lounge & Cafe</p>
            
            <div class="flex items-center justify-center gap-4 mt-4 text-xs text-gray-400">
                <span><i class="fa-solid fa-star text-gold mr-1"></i> 4.9 (500+)</span>
                <span>•</span>
                <span><i class="fa-solid fa-clock text-emerald-400 mr-1"></i> Open Now</span>
                <span>•</span>
                <span>$$$</span>
            </div>
        </header>

        <!-- Floating Utilities Area -->
        <div class="flex gap-2 mb-6 animate-slide-up" style="animation-delay: 0.2s;">
            <!-- Search bar -->
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Search deliciousness..." 
                    class="w-full pl-10 pr-4 py-3 bg-darkCard/80 border border-white/5 rounded-2xl text-sm focus:outline-none focus:border-gold/50 focus:ring-1 focus:ring-gold/50 transition-all duration-300">
            </div>
            <!-- Veg Toggle Switch -->
            <button id="vegToggle" onclick="toggleVeg()" class="glass px-4 py-3 rounded-2xl flex items-center gap-2 border border-white/5 transition-all active:scale-95">
                <div class="w-4 h-4 border-2 border-emerald-500 flex items-center justify-center rounded p-[2px]">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                </div>
                <span class="text-xs font-medium text-gray-300">Veg Only</span>
            </button>
        </div>

        <!-- Horizontal Categories (Sticky) -->
        <div class="sticky top-0 z-40 -mx-4 px-4 py-3 bg-darkBg/80 backdrop-blur-md border-b border-white/5 overflow-x-auto no-scrollbar flex gap-2">
            <button onclick="filterCategory('all')" class="cat-btn px-5 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-300 bg-gold text-darkBg shadow-md shadow-amber-500/10">✨ All</button>
            <button onclick="filterCategory('signature')" class="cat-btn px-5 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-300 bg-darkCard text-gray-400 hover:text-white">🔥 Signatures</button>
            <button onclick="filterCategory('mains')" class="cat-btn px-5 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-300 bg-darkCard text-gray-400 hover:text-white">🍔 Mains</button>
            <button onclick="filterCategory('beverages')" class="cat-btn px-5 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-300 bg-darkCard text-gray-400 hover:text-white">☕ Brews</button>
            <button onclick="filterCategory('desserts')" class="cat-btn px-5 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-300 bg-darkCard text-gray-400 hover:text-white">🍰 Sweet Tooth</button>
        </div>

        <!-- Menu Feed / Items -->
        <div id="menuContainer" class="mt-6 space-y-4 animate-slide-up" style="animation-delay: 0.3s;">
            <!-- Items will be dynamically loaded by Javascript below -->
        </div>

    </div>

    <!-- Sticky Bottom Navigation Cart Panel -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md glass rounded-3xl p-4 flex items-center justify-between shadow-2xl shadow-black/80 border border-white/10 z-50 animate-slide-up" style="animation-delay: 0.4s;">
        <div class="flex items-center gap-3">
            <div class="relative bg-gold/10 p-3 rounded-2xl">
                <i class="fa-solid fa-basket-shopping text-gold text-lg"></i>
                <span id="cartCount" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full font-bold border-2 border-darkBg scale-0 transition-transform">0</span>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 tracking-wider uppercase font-semibold">Your Selection</p>
                <p id="cartTotal" class="text-sm font-bold text-white">₹0.00</p>
            </div>
        </div>
        <button onclick="sendOrder()" class="bg-gradient-to-r from-amber-500 to-gold text-darkBg px-6 py-3 rounded-2xl text-xs font-bold shadow-lg shadow-amber-500/20 active:scale-95 transition-transform flex items-center gap-2">
            Place Order <i class="fa-brands fa-whatsapp text-sm font-bold"></i>
        </button>
    </div>

    <!-- JavaScript For Live Interaction and Aesthetics -->
    <script>
        // Premium Menu Items Data
        const menuItems = [
            {
                id: 1,
                name: "Gold Flaked Cappuccino",
                price: 249,
                desc: "Rich double shot organic espresso with microfoam, topped with genuine edible 24K gold flakes.",
                category: "beverages",
                isVeg: true,
                isSignature: true,
                tag: "Bestseller",
                image: "https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 2,
                name: "The SML Charcoal Burger",
                price: 399,
                desc: "Smoky flame-grilled artisan chicken patty, aged cheddar, truffle mayo, enclosed in a handcrafted activated charcoal bun.",
                category: "mains",
                isVeg: false,
                isSignature: true,
                tag: "Signature",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 3,
                name: "Truffle & Forest Mushroom Pasta",
                price: 449,
                desc: "Al dente fettuccine rolled in wild Porcini cream sauce, fresh truffles, shaved parmesan, and dynamic microgreens.",
                category: "mains",
                isVeg: true,
                isSignature: false,
                tag: "Premium",
                image: "https://images.unsplash.com/photo-1645112411341-6c4fd023714a?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 4,
                name: "Matcha Rose Affogato",
                price: 199,
                desc: "Indulge in a premium scoop of organic Madagascar vanilla bean gelato, drowned in ceremonial Japanese Matcha whisked with organic rose extract.",
                category: "beverages",
                isVeg: true,
                isSignature: false,
                tag: "New",
                image: "https://images.unsplash.com/photo-1594911774802-8822a707cfa3?auto=format&fit=crop&q=80&w=600"
            },
            {
                id: 5,
                name: "Lava Rocher Fondant",
                price: 299,
                desc: "Gourmet dark Belgian chocolate lava cake bursting with dynamic warm hazelnut praline core. Served with ice cream.",
                category: "desserts",
                isVeg: true,
                isSignature: true,
                tag: "Chef's Special",
                image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&q=80&w=600"
            }
        ];

        let cart = {};
        let activeCategory = 'all';
        let showVegOnly = false;

        const container = document.getElementById('menuContainer');
        const searchInput = document.getElementById('searchInput');

        // Dynamic Loading of Menu Card Items
        function renderMenu() {
            container.innerHTML = "";
            const searchValue = searchInput.value.toLowerCase();

            const filteredItems = menuItems.filter(item => {
                const matchesCategory = (activeCategory === 'all') || 
                                        (activeCategory === 'signature' && item.isSignature) || 
                                        (item.category === activeCategory);
                const matchesVeg = !showVegOnly || item.isVeg;
                const matchesSearch = item.name.toLowerCase().includes(searchValue) || item.desc.toLowerCase().includes(searchValue);
                
                return matchesCategory && matchesVeg && matchesSearch;
            });

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16">
                        <i class="fa-regular fa-face-frown text-4xl text-gray-600 mb-3"></i>
                        <p class="text-gray-400">Oops! No luxurious dishes match your criteria.</p>
                    </div>
                `;
                return;
            }

            filteredItems.forEach((item, index) => {
                const count = cart[item.id] || 0;
                const card = document.createElement('div');
                card.className = "bg-darkCard/50 p-4 rounded-2xl flex gap-4 items-center border border-white/5 hover:border-gold/20 transition-all duration-300 relative group overflow-hidden";
                card.style.animation = `slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) ${index * 0.05}s forwards`;
                
                card.innerHTML = `
                    <!-- Image with Veg/Non-veg label -->
                    <div class="w-24 h-24 rounded-xl overflow-hidden relative flex-shrink-0 bg-gray-900">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute top-2 left-2 w-4 h-4 bg-darkBg/80 backdrop-blur-md rounded flex items-center justify-center p-[2px] border ${item.isVeg ? 'border-emerald-500' : 'border-red-500'}">
                            <div class="w-1.5 h-1.5 rounded-full ${item.isVeg ? 'bg-emerald-500' : 'bg-red-500'}"></div>
                        </div>
                    </div>
                    
                    <!-- Content Details -->
                    <div class="flex-1 flex flex-col justify-between h-full">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-sm text-gray-100 group-hover:text-gold transition-colors duration-300 pr-2">${item.name}</h3>
                                ${item.tag ? `<span class="bg-amber-500/10 text-gold text-[9px] px-2 py-0.5 rounded-md font-bold uppercase tracking-wider whitespace-nowrap">${item.tag}</span>` : ''}
                            </div>
                            <p class="text-xs text-gray-400 mt-1 line-clamp-2 leading-relaxed">${item.desc}</p>
                        </div>
                        
                        <!-- Price and Increment/Decrement Buttons -->
                        <div class="flex justify-between items-center mt-3">
                            <span class="font-extrabold text-sm text-gold">₹${item.price}</span>
                            
                            <div class="flex items-center gap-2">
                                <button onclick="updateCart(${item.id}, -1)" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 active:scale-90 transition-all flex items-center justify-center border border-white/5 text-gray-300">
                                    <i class="fa-solid fa-minus text-xs"></i>
                                </button>
                                <span id="qty-${item.id}" class="text-xs font-bold w-4 text-center text-gray-100">${count}</span>
                                <button onclick="updateCart(${item.id}, 1)" class="w-8 h-8 rounded-lg bg-gold text-darkBg hover:bg-amber-400 active:scale-90 transition-all flex items-center justify-center font-bold">
                                    <i class="fa-solid fa-plus text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Cart State Engine
        function updateCart(itemId, amount) {
            if (!cart[itemId]) cart[itemId] = 0;
            cart[itemId] += amount;

            if (cart[itemId] <= 0) {
                delete cart[itemId];
            }

            document.getElementById(`qty-${itemId}`).innerText = cart[itemId] || 0;
            updateGlobalCartUI();
        }

        function updateGlobalCartUI() {
            let totalQty = 0;
            let totalPrice = 0;

            for (const id in cart) {
                const item = menuItems.find(i => i.id == id);
                totalQty += cart[id];
                totalPrice += item.price * cart[id];
            }

            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            cartTotal.innerText = `₹${totalPrice.toLocaleString('en-IN')}.00`;
            cartCount.innerText = totalQty;

            if (totalQty > 0) {
                cartCount.classList.remove('scale-0');
                cartCount.classList.add('scale-100');
            } else {
                cartCount.classList.add('scale-0');
                cartCount.classList.remove('scale-100');
            }
        }

        // Horizontal Filters Controller
        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-5 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-300 bg-darkCard text-gray-400 hover:text-white";
            });

            // Set active style
            event.target.className = "cat-btn px-5 py-2.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all duration-300 bg-gold text-darkBg shadow-md shadow-amber-500/10";
            
            renderMenu();
        }

        function toggleVeg() {
            showVegOnly = !showVegOnly;
            const btn = document.getElementById('vegToggle');
            if (showVegOnly) {
                btn.className = "glass px-4 py-3 rounded-2xl flex items-center gap-2 border border-emerald-500/40 bg-emerald-500/5 transition-all";
            } else {
                btn.className = "glass px-4 py-3 rounded-2xl flex items-center gap-2 border border-white/5 transition-all";
            }
            renderMenu();
        }

        // WhatsApp Order Action Creator
        function sendOrder() {
            let itemsText = "";
            let totalPrice = 0;

            for (const id in cart) {
                const item = menuItems.find(i => i.id == id);
                itemsText += `• *${item.name}* x ${cart[id]} - (₹${item.price * cart[id]})\n`;
                totalPrice += item.price * cart[id];
            }

            if (totalPrice === 0) {
                alert("Please add some delicacies to your order first!");
                return;
            }

            const message = encodeURIComponent(
                `👋 *Hello, Saad Media Labs Cafe!*\n\n` +
                `I would like to place an order from Table No. *07*:\n\n` +
                `${itemsText}\n` +
                `💰 *Total Value:* ₹${totalPrice}\n\n` +
                `Kindly prepare and confirm my order.`
            );

            // Opens WhatsApp with predefined message format
            window.open(`https://wa.me/919999999999?text=${message}`, '_blank');
        }

        // Search Input listener
        searchInput.addEventListener('input', renderMenu);

        // Run on initial load
        window.onload = renderMenu;
    </script>
</body>
</html>
