<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saad Media Labs Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #fafaf8;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            padding: 48px 24px 32px;
            border-bottom: 1px solid #eee;
        }

        .header .logo-mark {
            width: 48px;
            height: 48px;
            border: 2px solid #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header .tagline {
            font-size: 12px;
            color: #999;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .header .meta {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            font-size: 12px;
            color: #777;
        }

        .header .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.green { background: #34c759; }

        /* ── Category Tabs ── */
        .categories {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #fafaf8;
            border-bottom: 1px solid #eee;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar { display: none; }

        .categories-inner {
            display: flex;
            padding: 0 20px;
            gap: 0;
        }

        .cat-btn {
            background: none;
            border: none;
            padding: 14px 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            cursor: pointer;
            white-space: nowrap;
            position: relative;
            transition: color 0.3s;
        }

        .cat-btn.active {
            color: #1a1a1a;
            font-weight: 700;
        }

        .cat-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 16px;
            right: 16px;
            height: 2px;
            background: #1a1a1a;
            border-radius: 1px;
            animation: underline-in 0.3s ease;
        }

        @keyframes underline-in {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        /* ── Menu Section ── */
        .menu-section {
            padding: 0 20px 32px;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 600;
            padding: 28px 0 4px;
            color: #1a1a1a;
        }

        .section-line {
            width: 28px;
            height: 2px;
            background: #1a1a1a;
            margin-bottom: 20px;
        }

        /* ── Menu Item ── */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0ec;
            opacity: 0;
            transform: translateY(12px);
            animation: fade-up 0.4s ease forwards;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        @keyframes fade-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-info {
            flex: 1;
            padding-right: 16px;
        }

        .item-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .veg-icon {
            width: 14px;
            height: 14px;
            border: 1.5px solid;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .veg-icon.veg { border-color: #34a853; }
        .veg-icon.veg::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #34a853;
            border-radius: 50%;
        }

        .veg-icon.nonveg { border-color: #c53030; }
        .veg-icon.nonveg::after {
            content: '';
            width: 6px;
            height: 6px;
            background: #c53030;
            border-radius: 50%;
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .item-tag {
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: #1a1a1a;
            color: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 700;
        }

        .item-desc {
            font-size: 13px;
            color: #999;
            line-height: 1.5;
            margin-top: 4px;
        }

        .item-price {
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
            white-space: nowrap;
            padding-top: 2px;
        }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 32px 20px 48px;
            border-top: 1px solid #eee;
        }

        .footer .contact-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 20px;
        }

        .footer a {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #555;
            font-size: 16px;
            transition: all 0.2s;
        }

        .footer a:active {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
        }

        .footer p {
            font-size: 11px;
            color: #bbb;
            letter-spacing: 1px;
        }

        .footer .brand {
            font-size: 10px;
            color: #ccc;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── SVG Icons (inline) ── */
        .icon-svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo-mark">S</div>
        <h1>Saad Media Labs</h1>
        <div class="tagline">Café & Lounge</div>
        <div class="meta">
            <span><span class="dot green"></span> Open Now</span>
            <span>11 AM – 11 PM</span>
            <span>Lucknow</span>
        </div>
    </div>

    <!-- Category Tabs -->
    <div class="categories">
        <div class="categories-inner" id="categoryTabs">
            <!-- Built by JS -->
        </div>
    </div>

    <!-- Menu -->
    <div class="menu-section" id="menuSection">
        <!-- Built by JS -->
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="contact-row">
            <a href="tel:+919999999999" aria-label="Call">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.81.36 1.6.68 2.34a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.74-1.25a2 2 0 0 1 2.11-.45c.74.32 1.53.55 2.34.68A2 2 0 0 1 22 16.92z"/></svg>
            </a>
            <a href="https://maps.google.com" target="_blank" aria-label="Directions">
                <svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </a>
            <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                <svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            </a>
        </div>
        <p>GST & taxes included in all prices</p>
        <div class="brand">Powered by Saad Media Labs</div>
    </div>

    <script>
        const menu = [
            {
                category: "Signatures",
                items: [
                    { name: "Gold Cappuccino", desc: "Double shot espresso, steamed milk, edible gold flakes", price: 249, veg: true, tag: "Bestseller" },
                    { name: "SML Charcoal Burger", desc: "Grilled chicken, aged cheddar, truffle mayo, charcoal bun", price: 399, veg: false, tag: "Signature" },
                    { name: "Lava Rocher Fondant", desc: "Belgian chocolate lava cake, hazelnut praline, vanilla ice cream", price: 299, veg: true }
                ]
            },
            {
                category: "Mains",
                items: [
                    { name: "Truffle Mushroom Pasta", desc: "Fettuccine, porcini cream, fresh truffles, parmesan", price: 449, veg: true },
                    { name: "Smoked Chicken Wrap", desc: "Slow-smoked chicken, pickled onion, chipotle ranch", price: 299, veg: false },
                    { name: "Paneer Tikka Bowl", desc: "Charred paneer, mint chutney, saffron rice, raita", price: 329, veg: true },
                    { name: "Lamb Seekh Platter", desc: "Hand-rolled seekh kebabs, rumali roti, green chutney", price: 479, veg: false }
                ]
            },
            {
                category: "Beverages",
                items: [
                    { name: "Matcha Rose Latte", desc: "Ceremonial matcha, organic rose, oat milk", price: 199, veg: true, tag: "New" },
                    { name: "Cold Brew", desc: "18-hour steeped single origin, served over ice", price: 179, veg: true },
                    { name: "Virgin Mojito", desc: "Fresh mint, lime, soda, brown sugar", price: 149, veg: true },
                    { name: "Mango Lassi", desc: "Thick yogurt, Alphonso mango pulp, cardamom", price: 129, veg: true }
                ]
            },
            {
                category: "Desserts",
                items: [
                    { name: "Burnt Basque Cheesecake", desc: "Caramelized top, creamy center, berry compote", price: 279, veg: true },
                    { name: "Tiramisu", desc: "Espresso-soaked ladyfingers, mascarpone, cocoa", price: 249, veg: true },
                    { name: "Gulab Jamun Brûlée", desc: "Classic Indian dessert reimagined with crème brûlée", price: 199, veg: true, tag: "Chef's Pick" }
                ]
            }
        ];

        // Build category tabs
        const tabsContainer = document.getElementById('categoryTabs');
        const menuSection = document.getElementById('menuSection');

        function buildTabs() {
            const allBtn = document.createElement('button');
            allBtn.className = 'cat-btn active';
            allBtn.textContent = 'All';
            allBtn.onclick = () => scrollToCategory(null, allBtn);
            tabsContainer.appendChild(allBtn);

            menu.forEach(section => {
                const btn = document.createElement('button');
                btn.className = 'cat-btn';
                btn.textContent = section.category;
                btn.onclick = () => scrollToCategory(section.category, btn);
                tabsContainer.appendChild(btn);
            });
        }

        function setActiveTab(btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function scrollToCategory(category, btn) {
            setActiveTab(btn);
            if (!category) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            const el = document.getElementById('section-' + category);
            if (el) {
                const offset = document.querySelector('.categories').offsetHeight + 8;
                const top = el.getBoundingClientRect().top + window.scrollY - offset;
                window.scrollTo({ top, behavior: 'smooth' });
            }
        }

        // Build menu sections
        function buildMenu() {
            menu.forEach(section => {
                const wrapper = document.createElement('div');
                wrapper.id = 'section-' + section.category;

                const title = document.createElement('div');
                title.className = 'section-title';
                title.textContent = section.category;

                const line = document.createElement('div');
                line.className = 'section-line';

                wrapper.appendChild(title);
                wrapper.appendChild(line);

                section.items.forEach((item, i) => {
                    const el = document.createElement('div');
                    el.className = 'menu-item';
                    el.style.animationDelay = (i * 0.06) + 's';

                    el.innerHTML = `
                        <div class="item-info">
                            <div class="item-name-row">
                                <div class="veg-icon ${item.veg ? 'veg' : 'nonveg'}"></div>
                                <span class="item-name">${item.name}</span>
                                ${item.tag ? `<span class="item-tag">${item.tag}</span>` : ''}
                            </div>
                            <div class="item-desc">${item.desc}</div>
                        </div>
                        <div class="item-price">₹${item.price}</div>
                    `;

                    wrapper.appendChild(el);
                });

                menuSection.appendChild(wrapper);
            });
        }

        // Intersection observer to highlight tabs on scroll
        function setupScrollSpy() {
            const sections = menu.map(s => document.getElementById('section-' + s.category));
            const tabs = document.querySelectorAll('.cat-btn');
            const catHeight = document.querySelector('.categories').offsetHeight;

            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id.replace('section-', '');
                        tabs.forEach(tab => {
                            tab.classList.toggle('active', tab.textContent === id);
                        });
                    }
                });
            }, {
                rootMargin: `-${catHeight + 20}px 0px -60% 0px`,
                threshold: 0
            });

            sections.forEach(s => { if (s) observer.observe(s); });
        }

        buildTabs();
        buildMenu();
        setupScrollSpy();
    </script>
</body>
</html>
